<h5 class="pt40">Requisitos para ser inversionista</h5>

<hr class="pb20">

<div class="form-group">
    <label class="form-label" for="curp">CURP: <i class="fa fa-asterisk text-danger"></i></label>
    <div class="input-group">
        <input class="form-control" id="curp" name="provision[curp]" type="text" value="{{provision.curp}}"
            placeholder="" minlength="18" maxlength="18" required>
        <span class="input-group-btn">
            <button class="btn btn-info" type="button" id="btn-validar-curp">Validar / Autocompletar</button>
        </span>
    </div>
    <small id="curp-status" class="form-text text-muted"></small>
</div>

<hr />
<h5 class="pt20">Validación de Identidad (OCR)</h5>
<div class="form-group">
    <label class="form-label" for="id_type">Tipo de Documento:</label>
    <select class="form-control" id="id_type">
        <option value="INE">INE / IFE</option>
        <option value="PASAPORTE">Pasaporte</option>
        <option value="FM">Forma Migratoria (FM)</option>
        <option value="CEDULA">Cédula Profesional</option>
    </select>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="form-group">
            <label class="form-label">Frente del Documento:</label>
            <input type="file" class="form-control" id="id_front" accept="image/*">
        </div>
    </div>
    <div class="col-md-6" id="container-id-back">
        <div class="form-group">
            <label class="form-label">Reverso del Documento:</label>
            <input type="file" class="form-control" id="id_back" accept="image/*">
        </div>
    </div>
</div>

<div class="form-group">
    <button type="button" class="btn btn-primary" id="btn-verificar-id">
        <i class="fa fa-id-card"></i> Verificar Documento
    </button>
    <div id="ocr-loading" style="display:none; margin-top: 10px;">
        <i class="fa fa-spinner fa-spin"></i> Procesando documento...
    </div>
</div>

<div id="ocr-results" class="alert alert-success" style="display:none;">
    <strong>Datos extraídos:</strong>
    <ul id="ocr-data-list"></ul>
    <input type="hidden" name="provision[ocr_data]" id="ocr_data_hidden">
</div>
<hr />

<div class="form-group">
    <label class="form-label" for="rfc">RFC (opcional):</label>
    <input class="form-control" id="rfc" name="provision[rfc]" type="text" value="{{provision.rfc}}" placeholder="">
</div>

<script>

    function validarCURP(curp) {
        if (!curp || typeof curp !== "string") return false;

        curp = curp.toUpperCase().trim();

        // 1. Regex oficial de estructura
        const regex = /^[A-Z]{4}\d{6}[HM][A-Z]{2}[B-DF-HJ-NP-TV-Z]{3}[0-9A-Z]\d$/;

        if (!regex.test(curp)) return false;

        // 2. Validar dígito verificador
        const diccionario = "0123456789ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
        let suma = 0;

        for (let i = 0; i < 17; i++) {
            const valor = diccionario.indexOf(curp.charAt(i));
            suma += valor * (18 - i);
        }

        const digitoEsperado = (10 - (suma % 10)) % 10;
        const digitoReal = parseInt(curp.charAt(17), 10);

        return digitoEsperado === digitoReal;
    }

    function initializeValidation() {
        const curpInput = document.getElementById('curp');
        const birthYearSelect = document.getElementById('birth_year');
        const occupationCategorySelect = document.getElementById('occupation_category');
        const occupationSelect = document.getElementById('occupation');
        const publicOfficialSelect = document.getElementById('public_official');
        const sourceOfFundsSelect = document.getElementById('source_of_funds');
        const allocationSelect = document.getElementById('allocation');
        const depositFrequencySelect = document.getElementById('deposit_frequency');
        const cantidadAproximadaInput = document.getElementById('cantidad_aproximada');
        const avisoPrivacidadCheckbox = document.getElementById('aviso_privacidad');
        const submitButton = document.querySelector('input[name="submit"]');
        const messageDiv = document.getElementById('submit_meesage');

        // Check if all elements exist
        if (!curpInput || !birthYearSelect || !occupationCategorySelect ||
            !occupationSelect || !publicOfficialSelect || !sourceOfFundsSelect ||
            !allocationSelect || !depositFrequencySelect || !cantidadAproximadaInput ||
            !avisoPrivacidadCheckbox || !submitButton || !messageDiv) {
            return false;
        }

        // Function to validate all fields
        function validateForm() {
            const isCurpValid = validarCURP(curpInput.value);
            const isBirthYearSelected = birthYearSelect.value !== '';
            const isOccupationCategorySelected = occupationCategorySelect.value !== '';
            const isOccupationSelected = occupationSelect.value !== '';
            const isPublicOfficialSelected = publicOfficialSelect.value !== '';
            const isSourceOfFundsSelected = sourceOfFundsSelect.value !== '';
            const isAllocationSelected = allocationSelect.value !== '';
            const isDepositFrequencySelected = depositFrequencySelect.value !== '';
            const isCantidadAproximadaFilled = cantidadAproximadaInput.value.trim() !== '';
            const isAvisoPrivacidadChecked = avisoPrivacidadCheckbox.checked;

            let messages = [];

            // Check CURP validity
            if (!isCurpValid) {
                messages.push('Favor de colocar en el campo CURP un CURP valido');
            }

            // Check birth year selection
            if (!isBirthYearSelected) {
                messages.push('Año no seleccionado');
            }

            // Check occupation category
            if (!isOccupationCategorySelected) {
                messages.push('Categoría profesional vacia');
            }

            // Check occupation
            if (!isOccupationSelected) {
                messages.push('Ocupacion o profecion vacia');
            }

            // Check public official
            if (!isPublicOfficialSelected) {
                messages.push('Oficial Publico vacio');
            }

            // Check source of funds
            if (!isSourceOfFundsSelected) {
                messages.push('Fuente de los fondos vacio');
            }

            // Check allocation
            if (!isAllocationSelected) {
                messages.push('Destinos de recursos vacio');
            }

            // Check deposit frequency
            if (!isDepositFrequencySelected) {
                messages.push('Frecuencia de depositos vacia');
            }

            // Check cantidad aproximada
            if (!isCantidadAproximadaFilled) {
                messages.push('Cantidad Aproximada Vacia');
            }

            // Check privacy notice checkbox
            if (!isAvisoPrivacidadChecked) {
                messages.push('Falta aceptar Aviso de Privacidad');
            }

            // Update button and message display
            if (isCurpValid && isBirthYearSelected && isOccupationCategorySelected &&
                isOccupationSelected && isPublicOfficialSelected && isSourceOfFundsSelected &&
                isAllocationSelected && isDepositFrequencySelected && isCantidadAproximadaFilled &&
                isAvisoPrivacidadChecked) {
                submitButton.disabled = false;
                messageDiv.innerHTML = '';
                messageDiv.style.display = 'none';
            } else {
                submitButton.disabled = true;

                // Create list of error messages
                let messageHTML = '<h4><strong>Falta Completar:</strong></h4> <ul style="margin: 0; padding-left: 20px; list-style: disc;">';
                messages.forEach(function (msg) {
                    messageHTML += '<li style="font-weight: bold; color:#bd2d1;">' + msg + '</li>';
                });
                messageHTML += '</ul>';

                messageDiv.innerHTML = messageHTML;
                messageDiv.style.display = 'block';
                messageDiv.style.color = '#dc3545';
                messageDiv.style.marginTop = '10px';
                messageDiv.style.fontSize = '16px';
                messageDiv.style.fontWeight = 'bold';
            }
        }

        // Initial validation
        validateForm();

        // Add event listeners for all inputs
        curpInput.addEventListener('input', validateForm);
        birthYearSelect.addEventListener('change', validateForm);
        occupationCategorySelect.addEventListener('change', validateForm);
        occupationSelect.addEventListener('change', validateForm);
        publicOfficialSelect.addEventListener('change', validateForm);
        sourceOfFundsSelect.addEventListener('change', validateForm);
        allocationSelect.addEventListener('change', validateForm);
        depositFrequencySelect.addEventListener('change', validateForm);
        cantidadAproximadaInput.addEventListener('input', validateForm);
        avisoPrivacidadCheckbox.addEventListener('change', validateForm);

        return true;
    }

    // Try to initialize immediately
    if (!initializeValidation()) {
        // If elements not found, wait for DOM to be fully loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeValidation);
        } else {
            // DOM is already loaded, use MutationObserver to wait for the elements
            const observer = new MutationObserver(function (mutations) {
                if (initializeValidation()) {
                    observer.disconnect();
                }
            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        }
    }



</script>

<script>
    (function () {
        // --- CONFIGURATION ---
        const API_BASE_URL = 'https://m2crowd-back-dev.quo.services'; // Adjust if needed

        // --- DOM ELEMENTS ---
        const btnValidarCurp = document.getElementById('btn-validar-curp');
        const curpInput = document.getElementById('curp');
        const curpStatus = document.getElementById('curp-status');

        const btnVerificarId = document.getElementById('btn-verificar-id');
        const idTypeSelect = document.getElementById('id_type');
        const idFrontInput = document.getElementById('id_front');
        const idBackInput = document.getElementById('id_back');
        const containerIdBack = document.getElementById('container-id-back');
        const ocrLoading = document.getElementById('ocr-loading');
        const ocrResults = document.getElementById('ocr-results');
        const ocrDataList = document.getElementById('ocr-data-list');
        const ocrDataHidden = document.getElementById('ocr_data_hidden');

        // --- EVENT LISTENERS ---

        // 1. Validar CURP & Autofill
        if (btnValidarCurp) {
            btnValidarCurp.addEventListener('click', async function () {
                const curp = curpInput.value.trim().toUpperCase();
                if (!curp || curp.length < 18) {
                    alert('Por favor ingrese una CURP válida de 18 caracteres.');
                    return;
                }

                // UI Loading State
                btnValidarCurp.disabled = true;
                btnValidarCurp.textContent = 'Validando...';
                curpStatus.textContent = '';

                try {
                    const response = await fetch(`${API_BASE_URL}/identity/curp`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ curp: curp })
                    });

                    if (!response.ok) {
                        throw new Error('Error al validar CURP');
                    }

                    const data = await response.json();

                    // Success: Autofill fields
                    console.log('CURP Data:', data);

                    // Map fields (Adjust IDs based on your actual form structure)
                    // Common IDs in CrowdEngine / Register forms
                    const firstNameInput = document.getElementById('user_first_name') || document.querySelector('[name="user[first_name]"]');
                    const lastNameInput = document.getElementById('user_last_name') || document.querySelector('[name="user[last_name]"]');

                    if (firstNameInput && data.nombres) {
                        firstNameInput.value = data.nombres;
                    }

                    if (lastNameInput) {
                        // Combine paternal and maternal surnames
                        const apellidos = [data.apellidoPaterno, data.apellidoMaterno].filter(Boolean).join(' ');
                        lastNameInput.value = apellidos;
                    }

                    // Optional: Fill other fields if they exist (birthdate, gender, state)
                    // console.log('Data to map:', data);

                    curpStatus.textContent = 'CURP válida. Datos autocompletados.';
                    curpStatus.className = 'form-text text-success';

                } catch (error) {
                    console.error('Error:', error);
                    curpStatus.textContent = 'No se pudo validar la CURP. Verifique que sea correcta.';
                    curpStatus.className = 'form-text text-danger';
                } finally {
                    btnValidarCurp.disabled = false;
                    btnValidarCurp.textContent = 'Validar / Autocompletar';
                }
            });
        }

        // 2. ID Type Change (Show/Hide Back Image)
        if (idTypeSelect) {
            idTypeSelect.addEventListener('change', function () {
                const type = this.value;
                if (type === 'PASAPORTE') {
                    containerIdBack.style.display = 'none';
                } else {
                    containerIdBack.style.display = 'block';
                }
            });
        }

        // 3. Verify ID (OCR)
        if (btnVerificarId) {
            btnVerificarId.addEventListener('click', async function () {
                const type = idTypeSelect.value;
                const frontFile = idFrontInput.files[0];
                const backFile = idBackInput.files[0];

                if (!frontFile) {
                    alert('Por favor suba la imagen del frente del documento.');
                    return;
                }

                if (type !== 'PASAPORTE' && !backFile) {
                    alert('Por favor suba la imagen del reverso del documento.');
                    return;
                }

                // UI Loading State
                btnVerificarId.disabled = true;
                ocrLoading.style.display = 'block';
                ocrResults.style.display = 'none';
                ocrDataList.innerHTML = '';

                const formData = new FormData();
                formData.append('type', type);
                formData.append('front', frontFile);
                if (backFile) {
                    formData.append('back', backFile);
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/identity/verify-document`, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error('Error al verificar documento');
                    }

                    const result = await response.json();
                    console.log('OCR Result:', result);

                    // Display Results
                    ocrResults.style.display = 'block';

                    // Helper to add list item
                    const addStart = (label, value) => {
                        if (value) {
                            const li = document.createElement('li');
                            li.innerHTML = `<strong>${label}:</strong> ${value}`;
                            ocrDataList.appendChild(li);
                        }
                    };

                    // Map common OCR fields (adjust based on actual Nubarium response structure)
                    // Assuming response has `ocrData` or similar structure
                    const data = result.data || result; // Fallback

                    addStart('Nombre', data.name || data.nombres);
                    addStart('Primer Apellido', data.firstSurname || data.apellidoPaterno);
                    addStart('Segundo Apellido', data.secondSurname || data.apellidoMaterno);
                    addStart('CURP', data.curp);
                    addStart('Clave de Elector', data.claveElector);
                    addStart('CIC', data.cic);
                    addStart('OCR Code', data.ocrNumber);

                    // Save result to hidden input
                    if (ocrDataHidden) {
                        ocrDataHidden.value = JSON.stringify(result);
                    }

                    // Autofill if matches found and empty
                    if (curpInput && !curpInput.value && data.curp) {
                        curpInput.value = data.curp;
                    }

                } catch (error) {
                    console.error('OCR Error:', error);
                    alert('Ocurrió un error al procesar el documento. Intente nuevamente.');
                } finally {
                    btnVerificarId.disabled = false;
                    ocrLoading.style.display = 'none';
                }
            });
        }
    })();
</script>
